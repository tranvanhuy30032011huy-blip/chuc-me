<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng 20/10 - Gửi Mẹ Yêu Quý</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 50%, #fecfef 100%);
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Hiệu ứng trái tim bay nền */
        .heart {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            width: 18px;
            height: 18px;
            transform: rotate(45deg);
            animation: fly 6s linear infinite;
            bottom: -30px;
            filter: drop-shadow(0 0 6px rgba(255, 105, 180, 0.8));
        }

        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
        }

        .heart::before { top: -9px; left: 0; }
        .heart::after { left: -9px; top: 0; }

        @keyframes fly {
            0% {
                transform: translateY(0) rotate(45deg) scale(0.6);
                opacity: 1;
            }
            100% {
                transform: translateY(-105vh) rotate(85deg) scale(1.3);
                opacity: 0;
            }
        }

        /* Hiệu ứng cánh hoa rơi */
        .petal {
            position: absolute;
            background: #ffb6c1;
            border-radius: 15px 0 15px 0;
            opacity: 0.7;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Khung thiệp chính */
        .card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(216, 27, 96, 0.25), 0 0 20px rgba(255, 255, 255, 0.6);
            text-align: center;
            max-width: 520px;
            width: 90%;
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.8);
            animation: floatCard 4s ease-in-out infinite alternate, fadeIn 1.2s ease-in-out;
            position: relative;
        }

        @keyframes floatCard {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-12px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .card h1 {
            font-family: 'Dancing Script', cursive;
            color: #d81b60;
            font-size: 3.6rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(216, 27, 96, 0.2);
        }

        .card h2 {
            color: #ff2a75;
            font-size: 1.4rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .card p {
            color: #444;
            font-size: 1.08rem;
            line-height: 1.7;
            margin-bottom: 25px;
            min-height: 90px;
        }

        /* Dấu nháy chữ chạy */
        .typing-cursor {
            display: inline-block;
            background-color: #d81b60;
            width: 3px;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Tác giả */
        .author {
            font-size: 0.95rem;
            font-weight: 700;
            color: #880e4f;
            margin-top: 15px;
            letter-spacing: 0.5px;
            font-style: italic;
        }

        .btn {
            background: linear-gradient(45deg, #ff4081, #d81b60, #ff758c);
            background-size: 200% 200%;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 64, 129, 0.5);
            transition: all 0.3s ease;
            animation: gradientBtn 3s ease infinite;
        }

        @keyframes gradientBtn {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn:hover {
            transform: scale(1.06);
            box-shadow: 0 10px 25px rgba(255, 64, 129, 0.7);
        }

        /* Canvas pháo hoa */
        #fireworksCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <!-- Trái tim bay nền -->
    <div class="heart" style="left: 10%; animation-duration: 5s; animation-delay: 0s;"></div>
    <div class="heart" style="left: 25%; animation-duration: 7s; animation-delay: 1.5s;"></div>
    <div class="heart" style="left: 45%; animation-duration: 6s; animation-delay: 0.5s;"></div>
    <div class="heart" style="left: 65%; animation-duration: 8s; animation-delay: 2s;"></div>
    <div class="heart" style="left: 85%; animation-duration: 5.5s; animation-delay: 1s;"></div>

    <div class="card">
        <h1>Chúc Mừng 20/10</h1>
        <h2>Gửi Mẹ Yêu Quý Của Con! 💐</h2>
        <p id="typed-text"></p>
        
        <button class="btn" onclick="startFireworks()">Bắn Pháo Hoa Tặng Mẹ! 🎉</button>

        <div class="author">Tác giả: Trần Văn Huy</div>
    </div>

    <script>
        // Hiệu ứng chữ chạy (Typing Effect)
        const textToType = "Nhân ngày Phụ nữ Việt Nam 20/10, con xin gửi đến mẹ lời chúc chân thành nhất. Chúc mẹ luôn luôn mạnh khỏe, bình an, hạnh phúc và mãi là chỗ dựa vững chắc cho chúng con. Con yêu mẹ rất nhiều! ✨💖";
        const typedTextElement = document.getElementById("typed-text");
        let index = 0;

        function typeText() {
            if (index < textToType.length) {
                typedTextElement.innerHTML = textToType.substring(0, index + 1) + '<span class="typing-cursor"></span>';
                index++;
                setTimeout(typeText, 45);
            } else {
                typedTextElement.innerHTML = textToType;
            }
        }

        // Tạo hiệu ứng cánh hoa rơi tự động
        function createPetals() {
            for (let i = 0; i < 20; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.width = Math.random() * 12 + 8 + 'px';
                petal.style.height = Math.random() * 12 + 8 + 'px';
                petal.style.animationDuration = Math.random() * 5 + 5 + 's';
                petal.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(petal);
            }
        }
        createPetals();

        // Canvas pháo hoa nâng cao
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];

        function createFirework(x, y) {
            const particleCount = 80;
            const colors = ['#ff4081', '#ffeb3b', '#00e676', '#00e5ff', '#ff9100', '#e040fb'];
            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1,
                    size: Math.random() * 3 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.06;
                p.alpha -= 0.012;

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(animate);
        }

        animate();

        function startFireworks() {
            for (let i = 0; i < 6; i++) {
                setTimeout(() => {
                    const x = Math.random() * (canvas.width - 200) + 100;
                    const y = Math.random() * (canvas.height / 2) + 50;
                    createFirework(x, y);
                }, i * 250);
            }
        }

        window.onload = () => {
            setTimeout(typeText, 500);
            setTimeout(startFireworks, 1000);
        };
    </script>
</body>
</html>
